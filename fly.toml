app = "sam-climbing"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[env]
  DEBUG = "false"
  EMBEDDINGS_ENABLED = "true"
  TELEGRAM_ENABLED = "true"
  TIMEZONE = "America/Toronto"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
