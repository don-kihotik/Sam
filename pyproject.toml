[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "climbing-sam"
version = "0.1.0"
description = "A private Telegram climbing companion for a small group of friends."
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "openai>=1.100,<3",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

